<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e45c48" />
      <stop offset="100%" stop-color="#c94c3a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded pill -->
  <rect width="64" height="64" rx="16" fill="#2b2520" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#e45c48" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Logo de La Puerta: Arcos concéntricos -->
  <g transform="translate(7, 6) scale(0.5)" filter="url(#shadow)">
    <!-- Marco Exterior -->
    <path 
      d="M 10,105 L 10,12 L 90,12 L 90,105" 
      fill="none" 
      stroke="url(#doorGrad)" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Marco Medio -->
    <path 
      d="M 30,105 L 30,34 L 70,34 L 70,105" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Línea Central -->
    <path 
      d="M 50,105 L 50,56 L 50,105" 
      fill="none" 
      stroke="#d69b4c" 
      stroke-width="5" 
      stroke-linecap="round"
    />
  </g>
</svg>